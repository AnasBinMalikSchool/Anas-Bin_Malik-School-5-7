<script>
function applyDark(){
    document.querySelectorAll("*:not(nav):not(nav *)").forEach(el => {
        el.style.setProperty("background-color", "#111", "important");
        el.style.setProperty("color", "#ddd", "important");
    });

    document.querySelector("nav").style.setProperty("background-color", "rgb(87,17,34)", "important");

    document.querySelectorAll("nav *").forEach(el => {
        el.style.setProperty("background-color", "rgb(87,17,34)", "important");
    });
}

function applyLight(){
    document.querySelectorAll("*").forEach(el => {
        el.style.removeProperty("background-color");
        el.style.removeProperty("color");
    });
}

function dark(){
    localStorage.setItem("theme", "dark");
    applyDark();
}

function light(){
    localStorage.setItem("theme", "light");
    applyLight();
}

// تشغيل تلقائي عند فتح أي صفحة
window.addEventListener("load", () => {
    if(localStorage.getItem("theme") === "dark"){
        applyDark();
    } else {
        applyLight();
    }
});
</script>
